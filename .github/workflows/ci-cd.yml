name: Run All Tests Automatically

# This runs every time code is pushed, or a pull request is opened
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run_fast_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install everything needed
        run: pip install -r requirements.txt pytest
      - name: Run the fast tests (no Docker needed)
        run: pytest tests/unit -v

  run_full_system_tests:
    runs-on: ubuntu-latest
    needs: run_fast_unit_tests            # only runs if the fast tests passed first
    steps:
      - uses: actions/checkout@v4

      - name: Start the whole project
        run: docker compose up -d --build

      - name: Wait until the API responds
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Still waiting for the API to start..." && sleep 2
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Robot Framework
        run: pip install robotframework robotframework-requests

      - name: Run the full end-to-end tests
        run: robot --outputdir robot_results tests/robot

      - name: Save the test report, even if tests failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-report
          path: robot_results

      - name: Shut everything down
        if: always()
        run: docker compose down -v